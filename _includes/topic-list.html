<div class="tag-row">
  {% assign sorted_tags = site.tags | sort %}
  {% for tag in sorted_tags %}
    {% assign tag_slug = tag[0] | slugify %}
    <a class="tag-chip" {% if page.tag == tag[0] %}aria-current="page"{% endif %} href="{{ '/tags/' | append: tag_slug | append: '/' | relative_url }}">{{ tag[0] }} <span class="tag-count">{{ tag[1].size }}</span></a>
  {% endfor %}
</div>
