title: "Elliott C. Miller"
description: "ML engineer exploring weight-space learning, LLM systems, and agent architectures."
url: "https://emiller00.github.io"
baseurl: ""
theme: minima
markdown: kramdown
permalink: pretty
future: false

author:
  name: "Elliott C. Miller"
  email: "ellmill00@gmail.com"
  github: "Emiller00"
  linkedin: "elliott-miller-00"
  location: "Washington, DC"
  role: "ML Engineer"

header_pages:
  - index.md
  - blog.md
  - projects.md

plugins:
  - jekyll-feed

sass:
  style: compressed

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - vendor
  - .bundle
  - Gemfile
  - Gemfile.lock
  - node_modules
  - scripts
  - README.md
  - CONTENT_TEMPLATE.md
  - BLOG_POST_TEMPLATE.md
  - Elliott_Miller_Resume.pdf
  - messy_blog_ideas
  - serve.sh
  - symmetry-explainer
  - test-results
