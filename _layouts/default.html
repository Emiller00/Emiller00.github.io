<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8fc">
    <title>{% if page.title and page.title != 'Home' %}{{ page.title | escape }} — {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: page.summary | default: site.description | escape }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/art/mark.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/fonts.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
    {% if page.interactive == 'symmetry-intro' %}<link rel="stylesheet" id="symmetry-equation-styles" href="{{ '/assets/symmetry/katex.css' | relative_url }}">{% endif %}
    {% if page.interactive == 'symmetry-intro' %}<script type="module" src="{{ '/assets/symmetry/symmetry.js' | relative_url }}"></script>{% endif %}
    {%- feed_meta -%}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="site-shell">
      <header class="site-header">
        <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="Elliott C. Miller, home"><span class="brand-mark" aria-hidden="true">em<span>_</span></span><span>Elliott C. Miller</span></a>
        <nav class="site-nav" aria-label="Primary">
          <a href="{{ '/' | relative_url }}" {% if page.url == '/' or page.url == '/about/' %}aria-current="page"{% endif %}>About</a>
          <a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog/' or page.layout == 'post' %}aria-current="page"{% endif %}>Blog</a>
          <a href="{{ '/projects/' | relative_url }}" {% if page.url == '/projects/' %}aria-current="page"{% endif %}>Projects</a>
        </nav>
      </header>
      <main id="main">{{ content }}</main>
      <footer class="site-footer"><span class="footer-signature">Elliott C. Miller<span>Physics · Machine learning · Research</span></span><div class="footer-links"><a href="mailto:{{ site.author.email }}">Email ↗</a><a href="https://github.com/{{ site.author.github }}">GitHub ↗</a><a href="https://www.linkedin.com/in/{{ site.author.linkedin }}/">LinkedIn ↗</a><a href="{{ '/feed.xml' | relative_url }}">RSS ↗</a></div></footer>
    </div>
  </body>
</html>
